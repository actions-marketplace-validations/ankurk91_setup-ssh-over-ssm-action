name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: default alias
            alias: ssm-target
            run-dir: /tmp/ssm-e2e
            expect-multiplex: 'yes'

          # 62 characters or more used to overflow the control socket path.
          - scenario: 64-character alias
            alias: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            run-dir: /tmp/ssm-e2e-long-alias
            expect-multiplex: 'yes'

          # A deep HOME overflows it whatever the alias, so multiplexing must be dropped
          # and the connection must still work.
          - scenario: deep HOME
            alias: ssm-target
            run-dir: /tmp/e2e-deep-home-directory-that-exceeds-the-unix-domain-socket-path-limit-of-108-bytes
            expect-multiplex: 'no'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build the action bundles
        run: pnpm run build

      - name: Run the end-to-end suite
        env:
          ALIAS: ${{ matrix.alias }}
          RUN_DIR: ${{ matrix.run-dir }}
          EXPECT_MULTIPLEX: ${{ matrix.expect-multiplex }}
        run: test/e2e/run.sh

      # A glob rather than a list: every check the rig gains writes its own log, and a hardcoded
      # three would silently hide the one that failed.
      - name: Show action logs on failure
        if: failure()
        run: |
          shopt -s nullglob
          logs=("${{ matrix.run-dir }}"/*.log)
          if [ "${#logs[@]}" -eq 0 ]; then
            echo 'no logs were written'
            exit 0
          fi
          for log in "${logs[@]}"; do
            echo "----- $(basename "$log") -----"
            cat "$log"
          done
