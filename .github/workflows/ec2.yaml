name: EC2 Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ec2:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Execute this action
        uses: ./
        id: ssm-run
        with:
          instance-id: ${{ vars.EC2_INSTANCE_ID }}
          os-user: ubuntu

      - name: SSH to EC2
        run: |
          echo "--- uptime ---"
          ssh ssm-target 'uptime; echo; id; hostname -f'
          echo "--- end ---"

      # The only real-AWS check that DescribeSessions returns the --reason the ProxyCommand set. The
      # master opened above is still up, so the session is Active while this runs.
      - name: Verify the session carries this run's marker
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          MARKER: setup-ssh-over-ssm-action/${{ github.run_id }}/${{ github.run_attempt }}/
        run: |
          if ! reasons="$(aws ssm describe-sessions --state Active \
            --filters "key=Target,value=$INSTANCE_ID" \
            --query 'Sessions[].Reason' --output text)"; then
            echo 'describe-sessions itself failed: credentials or permissions, not the marker'
            exit 1
          fi
          echo "active session reasons: $reasons"
          case "$reasons" in
            *"$MARKER"*) echo 'Session carries this run marker' ;;
            *) echo "No active session carries $MARKER"; exit 1 ;;
          esac

      - name: SSH to EC2 (expect failure)
        run: |
          set +e
          ssh ssm-target 'definitely-not-a-real-command'
          CODE=$?
          set -e

          echo "Exit code was $CODE"
          if [ "$CODE" -ne 127 ]; then
            echo "Expected 127 (command not found), got $CODE"
            exit 1
          fi
          echo "Got expected exit code 127"

      - name: rsync test file to EC2
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          FILE="test-${RUN_ID}-${RUN_ATTEMPT}.log"
          echo "Creating $FILE"

          mkdir -p ./payload
          echo "run=$RUN_ID attempt=$RUN_ATTEMPT at $(date -u)" > "./payload/$FILE"

          rsync -avz --itemize-changes --stats \
            --rsync-path="mkdir -p /tmp/ci-test && rsync" \
            ./payload/ ssm-target:/tmp/ci-test/

          echo "REMOTE_FILE=/tmp/ci-test/$FILE" >> "$GITHUB_ENV"

      - name: Verify file landed
        run: |
          echo "--- remote listing ---"
          ssh ssm-target "ls -l /tmp/ci-test/"
          echo "--- remote file ---"
          ssh ssm-target "cat '$REMOTE_FILE'"
          echo "--- end ---"
